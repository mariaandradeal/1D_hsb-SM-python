[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hsbsm"
version = "0.1.0"
description = "Coupled hillslope-storage Boussinesq and soil-moisture model"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Marcus NÃ³brega Gomes JÃºnior"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8", "build>=1"]
notebook = ["jupyterlab>=4"]

[project.scripts]
hsbsm = "hsbsm.cli:main"

[project.urls]
Source = "https://github.com/mariaandradeal/1D_hsb-SM-python"
"MATLAB reference" = "https://github.com/marcusnobrega-eng/1D_hsb-SM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
